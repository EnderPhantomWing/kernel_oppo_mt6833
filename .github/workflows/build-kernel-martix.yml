name: (Martix) 编译内核（可配置 KernelSU /ReSukiSU / LXC-Docker / KVM）

on:
  workflow_dispatch:
    inputs:
    
      enable_all_roots:
        description: '构建所有 Root 管理器（Matrix 矩阵构建）'
        required: false
        default: false
        type: boolean
        
      enable_kernelsu:
        description: '启用 KernelSU 支持'
        required: false
        default: false
        type: boolean
        
      enable_resukisu:
        description: '启用 ReSukiSU 支持'
        required: false
        default: false
        type: boolean

      enable_susfs:
        description: '启用 SUSFS 支持'
        required: false
        default: false
        type: boolean
      
      enable_lxc_docker:
        description: '启用 LXC / Docker 支持（需配合 KernelSU）'
        required: false
        default: false
        type: boolean
        
      enable_kvm:
        description: '启用 KVM 支持'
        required: false
        default: false
        type: boolean

jobs:
  # 定义矩阵构建的配置
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      root-configs: ${{ steps.set-matrix.outputs.root-configs }}
      total-count: ${{ steps.set-matrix.outputs.total-count }}
    steps:    
      - name: 设置矩阵配置
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.enable_all_roots }}" = "true" ]; then
            # 当启用全部构建时，构建所有root管理器
            ROOT_CONFIGS='["kernelsu", "resukisu"]'
            TOTAL_COUNT=4
          else
            # 否则根据勾选情况构建
            ROOT_LIST=""
            if [ "${{ github.event.inputs.enable_kernelsu }}" = "true" ]; then
              ROOT_LIST="${ROOT_LIST} kernelsu"
            fi
            if [ "${{ github.event.inputs.enable_resukisu }}" = "true" ]; then
              ROOT_LIST="${ROOT_LIST} resukisu"
            fi
            
            if [ -z "$ROOT_LIST" ]; then
              ROOT_LIST="none"
            fi
            
            # 转换为JSON数组
            ROOT_CONFIGS=$(echo $ROOT_LIST | tr ' ' '\n' | jq -R . | jq -s .)
            TOTAL_COUNT=$(echo $ROOT_CONFIGS | jq length)
          fi
          
          echo "root-configs=$ROOT_CONFIGS" >> $GITHUB_OUTPUT
          echo "total-count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "Root configs: $ROOT_CONFIGS"
          echo "Total count: $TOTAL_COUNT"

  build:
    needs: setup-matrix
    # 如果有启用的root配置则运行，否则跳过
    if: needs.setup-matrix.outputs.total-count != '0' && needs.setup-matrix.outputs.root-configs != '["none"]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: ${{ fromJson(needs.setup-matrix.outputs.root-configs) }}
      fail-fast: false
    env:
      ROOT_TYPE: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - name: 构建编译内核环境
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi jq
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: 下载 Gcc 编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir gcc64
          wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
          mkdir gcc32
          wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz

      - name: 下载 Clang 编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir clang-aosp
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/EnderPhantomWing/kernel_oppo_mt6833 android-kernel
          cd android-kernel

      - name: 设置 ccache 缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-oppo-mt6833-${{ matrix.root }}
          max-size: 2G

      # ========== KernelSU 相关 ==========
      - name: KernelSU - 应用 legacy patch
        if: matrix.root == 'kernelsu'
        run: |
          echo "KSU_LOG: 开始下载并应用 RKSU 官方 4.14 patch"
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.14.patch -O ksu-4.14.patch || { echo "下载 patch 失败"; exit 1; }
          patch -p1 < ksu-4.14.patch || { echo "patch 应用失败"; cat ksu-4.14.patch; exit 1; }

      - name: KernelSU - 植入 KernelSU
        if: matrix.root == 'kernelsu'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash
          
      # ========== ReSukiSU 相关 ==========
      - name: ReSukiSU - 应用 legacy patch
        if: matrix.root == 'resukisu'
        run: |
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo "KSU_LOG: SUSFS 使用 ReSukiSU inline hooks，跳过 4.14 manual hook patch"
          else
            echo "KSU_LOG: 开始下载并应用 ReSukiSU 官方 4.14 patch"
            cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
            wget https://github.com/ReSukiSU/ReSukiSU_Patches/raw/main/scope-minimized/kernel-4.14.patch -O ksu-4.14.patch || { echo "下载 patch 失败"; exit 1; }
            patch -p1 < ksu-4.14.patch || { echo "patch 应用失败"; cat ksu-4.14.patch; exit 1; }
          fi

      - name: ReSukiSU - 植入 KSU 核心
        if: matrix.root == 'resukisu'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf KernelSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo "KSU_LOG: 应用 ReSukiSU SUSFS inline hooks"
            curl -LfsS \
              https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
              -o susfs_inline_hook_patches.sh \
              || { echo "下载 SUSFS inline hook 脚本失败"; exit 1; }
            bash susfs_inline_hook_patches.sh
          fi

      - name: SUSFS - 应用 SUSFS patch
        if: matrix.root == 'resukisu' && inputs.enable_susfs == true
        run: |
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            echo "KSU_LOG: 开启 SUSFS"
            wget https://raw.githubusercontent.com/sanba0519/Kernel-patch/refs/heads/main/susfs_patch_to_4.14.patch -O susfs-4.14.patch
            # wget https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.14/kernel_patches/50_add_susfs_in_kernel-4.14.patch -O susfs-4.14.patch
            patch -p1 -F 3 < susfs-4.14.patch || { echo "SUSFS patch 应用失败"; exit 1; }
            # A label cannot be followed directly by a declaration in GNU C89.
            sed -i 's/^orig_flow:$/orig_flow:;/' fs/notify/fdinfo.c
            grep -q '^orig_flow:;$' fs/notify/fdinfo.c \
              || { echo "SUSFS fdinfo 4.14 兼容修正失败"; exit 1; }
          fi

      # ========== LXC / Docker 支持 ==========
      - name: LXC/Docker - 开启内核配置
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://github.com/wu17481748/lxc-docker/releases/download/lxc-docker-2config/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x LXC-DOCKER-OPEN-CONFIG.sh
          ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/PFGM00_defconfig -w

      - name: LXC/Docker - 禁用 task_turbo 模块
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          sed -i '/CONFIG_MTK_TASK_TURBO/d' arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_MTK_TASK_TURBO is not set" >> arch/arm64/configs/PFGM00_defconfig

      - name: LXC/Docker - 打入 runc 补丁
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/tomxi1997/lxc-docker-support-for-android/refs/heads/main/runcpatch.sh
          chmod +x runcpatch.sh
          if [ -f android-kernel/kernel/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup.c
          fi
          if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c
          fi

      - name: LXC/Docker - 打入 xt_qtaguid 补丁
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ -f android-kernel/net/netfilter/xt_qtaguid.c ]; then
            wget https://github.com/wu17481748/lxc-docker/releases/download/lxc/lxc.patch
            patch -p0 < lxc.patch
          fi

      - name: LXC/Docker - 关闭 ANDROID_PARANOID_NETWORK
        if: inputs.enable_lxc_docker == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/PFGM00_defconfig

      # ========== KVM 支持 ==========
      - name: KVM - 开启配置
        if: inputs.enable_kvm == true
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          echo "CONFIG_VIRTUALIZATION=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "CONFIG_KVM=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "CONFIG_VHOST_NET=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y" >> android-kernel/arch/arm64/configs/PFGM00_defconfig

      # ========== 编译内核 ==========
      - name: 开始编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export KBUILD_BUILD_HOST=Github@EnderPhantomWing
          export KBUILD_BUILD_USER=EnderPhantomWing
          
          # 如果启用 LXC/Docker，额外添加 KCFLAGS 忽略特定警告
          if [ "${{ inputs.enable_lxc_docker }}" = "true" ]; then
            KCFLAGS_EXTRA="-Wno-error=sizeof-array-div"
          else
            KCFLAGS_EXTRA=""
          fi

          # KernelSU 和 SUSFS 配置
          # 如果启用了 SUSFS，无论哪个 SU 都必须启用 CONFIG_KSU_SUSFS
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            cat << EOF >> $GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/configs/PFGM00_defconfig
            CONFIG_KSU=y
            CONFIG_KSU_SUSFS=y
            CONFIG_KSU_MANUAL_HOOK=n
            CONFIG_KSU_TRACEPOINT_HOOK=n
          EOF
            # echo "KSU_LOG: 启用 CONFIG_KSU + CONFIG_KSU_SUSFS"
            # ./scripts/config --file out/.config \
            #   --enable CONFIG_KSU \
            #   --enable CONFIG_KSU_SUSFS \
            #   --disable CONFIG_KSU_MANUAL_HOOK \
            #   --disable CONFIG_KSU_TRACEPOINT_HOOK
          elif [ "${{ github.event.inputs.enable_resukisu }}" = "true" ]; then
            echo "KSU_LOG: ReSukiSU 不启用 SUSFS，使用 manual hook"
            cat << EOF >> $GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/configs/PFGM00_defconfig
            CONFIG_KSU=y
            CONFIG_KSU_MANUAL_HOOK=y
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_TRACEPOINT_HOOK=n
          EOF
            # ./scripts/config --file out/.config \
            #   --enable CONFIG_KSU \
            #   --enable CONFIG_KSU_MANUAL_HOOK \
            #   --disable CONFIG_KSU_SUSFS \
            #   --disable CONFIG_KSU_TRACEPOINT_HOOK
          fi
          
          make -s -j$(nproc --all) O=out ARCH=arm64 PFGM00_defconfig
          # make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            KCFLAGS="$KCFLAGS_EXTRA"

      # ========== 打包 AnyKernel3 ==========
      - name: 制作 AnyKernel3 卡刷包
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          # 统一使用官方 osm0sis 的 AnyKernel3（若需更换源可在此调整）
          # ak3 刷入问题修复：https://github.com/LF-Repo/kernel_oppo_mt6833/pull/1/changes
          git clone https://github.com/EnderPhantomWing/AnyKernel3
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

      - name: 上传 AnyKernel3 包 - ${{ matrix.root }}
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel-${{ matrix.root }}.zip
          path: kernel_workspace/AnyKernel3/*

      - name: 上传内核镜像 - ${{ matrix.root }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ matrix.root }}.gz
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
