name: Build Kernel for PFGM00-MT6833

on:
  workflow_dispatch:
    inputs:
      enable_all_roots:
        description: '构建所有 Root 管理器（矩阵构建）'
        required: false
        default: false
        type: boolean
      enable_kernelsu:
        description: '启用 KernelSU 支持'
        required: false
        default: false
        type: boolean
      enable_bakasu:
        description: '启用 BakaSU (原ReSukiSU) 支持'
        required: false
        default: false
        type: boolean
      enable_susfs:
        description: '启用 SUSFS'
        required: false
        default: false
        type: boolean
      enable_bbr:
        description: "启用 BBR 加速"
        required: false
        default: false
        type: boolean
      enable_nomount:
        description: '启用 NoMount VFS 挂载'
        required: false
        default: false
        type: boolean
      enable_lxc_docker:
        description: '启用 LXC / Docker 支持'
        required: false
        default: false
        type: boolean
      enable_kvm:
        description: '启用 KVM 支持'
        required: false
        default: false
        type: boolean
      branch:
        description: '选择要克隆的分支（仅限开发者）'
        required: true
        default: 'main/4.14.186'
        type: choice
        options:
          - main/4.14.186
          - main/bpf/4.14.186-2

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup.outputs.matrix }}
      total: ${{ steps.setup.outputs.total }}
      tag: ${{ steps.setup.outputs.tag }}
    steps:
      - name: 生成矩阵与发布标签
        id: setup
        env:
          ENABLE_ALL_ROOTS: ${{ inputs.enable_all_roots }}
          ENABLE_KERNELSU: ${{ inputs.enable_kernelsu }}
          ENABLE_BAKASU: ${{ inputs.enable_bakasu }}
          ENABLE_LXC_DOCKER: ${{ inputs.enable_lxc_docker }}
          ENABLE_KVM: ${{ inputs.enable_kvm }}
          ENABLE_BBR: ${{ inputs.enable_bbr }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ROOTS="[]"
          if [ "$ENABLE_ALL_ROOTS" = "true" ]; then
            ROOTS='["kernelsu","bakasu"]'
          else
            if [ "$ENABLE_KERNELSU" = "true" ]; then
              ROOTS=$(echo "$ROOTS" | jq -c '. + ["kernelsu"]')
            fi
            if [ "$ENABLE_BAKASU" = "true" ]; then
              ROOTS=$(echo "$ROOTS" | jq -c '. + ["bakasu"]')
            fi
          fi

          COUNT=$(echo "$ROOTS" | jq length)
          if [ "$COUNT" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FUNC_SUFFIX=""
          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-Docker"; fi
          if [ "$ENABLE_KVM" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-KVM"; fi
          if [ "$ENABLE_BBR" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-BBR"; fi
          if [ "$ENABLE_SUSFS" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-SUSFS"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-NoMount"; fi

          if [ "$COUNT" -gt 1 ]; then
            BASE="All"
          else
            BASE=$(echo "$ROOTS" | jq -r '.[0]')
          fi

          TAG="$(date -u +'%Y%m%d')-${BASE}${FUNC_SUFFIX}-build.${RUN_NUMBER}"

          MATRIX=$(for root in $(echo "$ROOTS" | jq -r '.[]'); do
            if [ "$root" = "bakasu" ]; then
              NAME="PFGM00-MT6833-BakaSU"
            else
              NAME="PFGM00-MT6833-RKSU"
            fi
            NAME="${NAME}${FUNC_SUFFIX}"
            jq -cn --arg root "$root" --arg artifact "$NAME" '{root:$root, artifact:$artifact}'
          done | jq -s -c .)

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "total=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"
          echo "Tag: $TAG"

  build:
    needs: setup
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ROOT_TYPE: ${{ matrix.root }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
      ENABLE_BBR: ${{ inputs.enable_bbr }}
      ENABLE_LXC_DOCKER: ${{ inputs.enable_lxc_docker }}
      ENABLE_KVM: ${{ inputs.enable_kvm }}
      BRANCH: ${{ inputs.branch }}
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install \
            git make bc bison ccache openssl dos2unix zip kmod cpio flex \
            libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler \
            ca-certificates python3 binutils binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi jq
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: 下载 GCC / Clang 工具链
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace

          mkdir -p gcc64 gcc32 clang-aosp

          wget -O gcc-aarch64.tar.gz --tries=3 --timeout=30 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz \
            || wget -O gcc-aarch64.tar.gz --tries=3 --timeout=30 \
            https://github.com/EnderPhantomWing/kernel_oppo_mt6833/releases/download/toolchain/aarch64-linux-android-4.9-refs_tags_android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz

          wget -O gcc-arm.tar.gz --tries=3 --timeout=30 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz \
            || wget -O gcc-arm.tar.gz --tries=3 --timeout=30 \
            https://github.com/EnderPhantomWing/kernel_oppo_mt6833/releases/download/toolchain/arm-linux-androideabi-4.9-refs_tags_android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz

          git clone -q --depth=1 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
            -b 10.0 clang-aosp

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone -b "$BRANCH" \
            https://github.com/EnderPhantomWing/kernel_oppo_mt6833.git android-kernel

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-mt6833-${{ matrix.root }}
          max-size: 2G

      - name: 应用 Root 补丁
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          case "$ROOT_TYPE" in
            kernelsu)
              echo "KSU_LOG: 下载并应用 RKSU 官方 4.14 补丁"
              wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.14.patch -O ksu-4.14.patch
              patch -p1 < ksu-4.14.patch || { echo "补丁应用失败"; exit 1; }
              ;;
            bakasu)
              echo "KSU_LOG: 下载并应用 BakaSU (ReSukiSU) 官方 4.14 补丁"
              wget https://github.com/ReSukiSU/ReSukiSU_Patches/raw/main/scope-minimized/kernel-4.14.patch -O ksu-4.14.patch
              patch -p1 < ksu-4.14.patch || { echo "补丁应用失败"; exit 1; }
              ;;
          esac

      - name: 启用 SUSFS
        if: env.ENABLE_SUSFS == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          wget https://raw.githubusercontent.com/EnderPhantomWing/kernel-patch/refs/heads/main/susfs_patch_to_4.14.patch -O susfs-4.14.patch
          patch -p1 < susfs-4.14.patch || { echo "SUSFS 补丁应用失败"; exit 1; }
          sed -i 's/^orig_flow:$/orig_flow:;/' fs/notify/fdinfo.c
          grep -q '^orig_flow:;$' fs/notify/fdinfo.c \
            || { echo "SUSFS fdinfo 兼容性修复失败"; exit 1; }

      - name: 启用 NoMount
        if: env.ENABLE_NOMOUNT == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LfsS \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
            -o nomount-setup.sh \
            || { echo "下载 NoMount setup 脚本失败"; exit 1; }
          bash nomount-setup.sh dev

      - name: 注入 Root 核心代码
        id: inline
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace

          if [ "$ROOT_TYPE" = "kernelsu" ]; then
            git clone --bare https://github.com/rsuntk/KernelSU.git
            COUNT=$(git -C KernelSU.git rev-list --count HEAD)
            MV=$((29971 + COUNT))
            echo "$MV" > manager_version_kernelsu.txt

            cd android-kernel
            rm -rf KernelSU
            curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash
          else
            git clone --bare https://github.com/Baka-SU/BakaSU.git
            COUNT=$(git -C BakaSU.git rev-list --count HEAD)
            MV=$((30000 + COUNT + 700))
            echo "$MV" > manager_version_bakasu.txt

            cd android-kernel
            rm -rf KernelSU
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          fi

          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "KSU_LOG: 应用 SUSFS 内联钩子"
            curl -LfsS \
              https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
              -o susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh
          fi

      - name: LXC/Docker 支持
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace

          wget https://github.com/wu17481748/android-lxc-docker/releases/download/lxc-docker-2config/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x LXC-DOCKER-OPEN-CONFIG.sh
          ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/PFGM00_defconfig -w

          cd android-kernel
          sed -i '/CONFIG_MTK_TASK_TURBO/d' arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_MTK_TASK_TURBO is not set" >> arch/arm64/configs/PFGM00_defconfig

          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/tomxi1997/lxc-docker-support-for-android/refs/heads/main/runcpatch.sh
          chmod +x runcpatch.sh
          if [ -f android-kernel/kernel/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup.c
          fi
          if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c
          fi

          if [ -f android-kernel/net/netfilter/xt_qtaguid.c ]; then
            wget https://raw.githubusercontent.com/wu17481748/android-lxc-docker/refs/heads/main/xt_qtaguid.patch
            patch -p0 < xt_qtaguid.patch || { echo "xt_qtaguid patch 失败"; exit 1; }
          fi

          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/PFGM00_defconfig

      - name: 配置 defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          if [ "$ENABLE_KVM" = "true" ]; then
            cat >> arch/arm64/configs/PFGM00_defconfig <<'EOF'
          CONFIG_VIRTUALIZATION=y
          CONFIG_KVM=y
          CONFIG_VHOST_NET=y
          CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y
          EOF
          fi

          make -j$(nproc --all) O=out ARCH=arm64 PFGM00_defconfig

          if [ "$ENABLE_BBR" = "true" ]; then
            ./scripts/config --file out/.config \
              --enable CONFIG_TCP_CONG_BBR \
              --enable CONFIG_NET_SCH_FQ
          fi

          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then
            echo "KCFLAGS_EXTRA=-Wno-error=sizeof-array-div" >> "$GITHUB_ENV"
          else
            echo "KCFLAGS_EXTRA=" >> "$GITHUB_ENV"
          fi

          if [ "$ENABLE_SUSFS" = "true" ]; then
            ./scripts/config --file out/.config \
              --enable KSU \
              --enable KSU_SUSFS \
              --enable KSU_MANUAL_HOOK \
              --disable KSU_TRACEPOINT_HOOK
          else
            ./scripts/config --file out/.config \
              --enable KSU \
              --enable KSU_MANUAL_HOOK \
              --disable KSU_SUSFS \
              --disable KSU_TRACEPOINT_HOOK
          fi

          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            ./scripts/config --file out/.config \
              --enable CONFIG_NOMOUNT \
              --enable CONFIG_KEYS
          else
            ./scripts/config --file out/.config \
              --disable CONFIG_NOMOUNT
          fi

          ./scripts/config --file out/.config \
            --enable NAMESPACES \
            --enable DEVTMPFS \
            --disable USER_NS \
            --enable DEVTMPFS_MOUNT \
            --enable SECTION_MISMATCH_WARN_ONLY

          make O=out ARCH=arm64 olddefconfig

          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            grep -qx 'CONFIG_NOMOUNT=y' out/.config \
              && grep -qx 'CONFIG_KEYS=y' out/.config \
              || { echo "NoMount 或 CONFIG_KEYS 配置未生效，终止编译"; exit 1; }
          elif grep -Eq '^CONFIG_NOMOUNT=(y|m)$' out/.config; then
            echo "NoMount 未关闭，终止编译"
            exit 1
          fi

      - name: 构建内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export KBUILD_BUILD_HOST=Github@EnderPhantomWing
          export KBUILD_BUILD_USER=EnderPhantomWing

          BUILD_TIME=$(date -u +%Y%m%dT%H%M%SZ)
          COMMIT_SHORT=${GITHUB_SHA:0:10}
          RUN_NUMBER=$(printf "%05d" "${{ github.run_number }}")
          export LOCALVERSION="-g${COMMIT_SHORT}-${RUN_NUMBER}-${BUILD_TIME}"

          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            KCFLAGS="$KCFLAGS_EXTRA"

          KERNEL_VERSION=$(make -s O=out ARCH=arm64 kernelrelease | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "$KERNEL_VERSION" > ../kernel_version_${ROOT_TYPE}.txt

      - name: 打包 AnyKernel3 与镜像
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/EnderPhantomWing/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

          ZIP_NAME="${ARTIFACT_NAME}.zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
          cp android-kernel/out/arch/arm64/boot/Image.gz "Image-${ROOT_TYPE}.gz"
          ls -lh "${ZIP_NAME}" "Image-${ROOT_TYPE}.gz"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.root }}
          path: |
            kernel_workspace/${{ matrix.artifact }}.zip
            kernel_workspace/Image-${{ matrix.root }}.gz
            kernel_workspace/kernel_version_${{ matrix.root }}.txt
            kernel_workspace/manager_version_${{ matrix.root }}.txt
          if-no-files-found: error

  release:
    needs: [setup, build]
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成摘要
        id: summary
        run: |
          MATRIX='${{ needs.setup.outputs.matrix }}'
          {
            echo "### Build Variables Summary"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Branch** | ${{ inputs.branch }} |"
            echo "| **Root Config** | ${{ needs.setup.outputs.matrix }} |"
            echo "| **Total** | ${{ needs.setup.outputs.total }} |"
            echo "| **Publish Tag** | ${{ needs.setup.outputs.tag }} |"
            echo "| **Enable SUSFS** | ${{ inputs.enable_susfs }} |"
            echo "| **Enable NoMount** | ${{ inputs.enable_nomount }} |"
            echo "| **Enable BBR** | ${{ inputs.enable_bbr }} |"
            echo "| **Enable LXC/Docker** | ${{ inputs.enable_lxc_docker }} |"
            echo "| **Enable KVM** | ${{ inputs.enable_kvm }} |"
            echo ""
            echo "### Build Matrix"
            echo ""
            echo "| Root Type | Artifact Name | Kernel Version | Root Manager Version |"
            echo "|-----------|---------------|----------|------------|"
            echo "$MATRIX" | jq -r '.[] | [.root, .artifact] | @tsv' | while IFS=$'\t' read -r root artifact; do
              KV_FILE="artifacts/kernel_version_${root}.txt"
              MV_FILE="artifacts/manager_version_${root}.txt"
              KV=$(cat "$KV_FILE" 2>/dev/null || echo "N/A")
              MV=$(cat "$MV_FILE" 2>/dev/null || echo "N/A")
              echo "| $root | ak3-$root / ${artifact}.zip | $KV | $MV |"
            done
            echo ""
            echo "### Environment Infomation"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Commit SHA** | ${{ github.sha }} |"
            echo "| **Action Run Number** | ${{ github.run_number }} |"
            echo "| **Action Name** | Build Kernel for PFGM00-MT6833 |"
          } > summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY
          {
            echo "summary_release<<EOF"
            cat summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载 BakaSU Manager APK
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_PAT }}
        run: |
          set -euo pipefail
          MATRIX='${{ needs.setup.outputs.matrix }}'
          mkdir -p artifacts/apks
          RELEASES_JSON=$(gh api --paginate --slurp /repos/EnderPhantomWing/BakaSU_CI/releases)

          echo "$MATRIX" | jq -r '.[] | [.root, .artifact] | @tsv' | while IFS=$'\t' read -r root artifact; do
            MV_FILE="artifacts/manager_version_${root}.txt"
            if [ ! -f "$MV_FILE" ]; then
              echo "跳过 ${root}: 未找到 manager 版本文件"
              continue
            fi

            MV=$(tr -d '[:space:]' < "$MV_FILE")
            if [ -z "$MV" ]; then
              echo "跳过 ${root}: manager 版本为空"
              continue
            fi

            MV_CLEAN="${MV#v}"
            MV_CLEAN="${MV_CLEAN#V}"

            ASSET_JSON=$(echo "$RELEASES_JSON" | jq -c --arg mv "$MV_CLEAN" '
              [
                .[]
                | . as $rel
                | .assets[]?
                | select(.name | test("-arm64-v8a-release\\.apk$"; "i"))
                | select(
                    (.name               | contains($mv))
                    or ($rel.tag_name    | contains($mv))
                    or (($rel.name // "") | contains($mv))
                  )
                | {
                    tag:  $rel.tag_name,
                    name: .name,
                    url:  .browser_download_url
                  }
              ] | first // empty
            ')

            DOWNLOAD_URL=$(echo "$ASSET_JSON" | jq -r '.url  // empty')
            ASSET_NAME=$(echo "$ASSET_JSON"   | jq -r '.name // empty')

            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
              echo "警告: 未找到匹配 ${MV_CLEAN} 的 *-arm64-v8a-release.apk，跳过 ${root}"
              continue
            fi

            echo "下载 ${ASSET_NAME}"
            curl -fL --retry 3 --retry-delay 5 \
              -o "artifacts/apks/${ASSET_NAME}" \
              "$DOWNLOAD_URL"
          done

          ls -lh artifacts/apks/ || true

      - name: 列出文件
        run: find artifacts -type f

      - name: 创建发布并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.tag }}
          body: |
            Automated release
            | Commit ${{ github.sha }} | Build #${{ github.run_number }} |

            ${{ steps.summary.outputs.summary_release }}
          files: |
            artifacts/*.zip
            artifacts/*.gz
            artifacts/apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
