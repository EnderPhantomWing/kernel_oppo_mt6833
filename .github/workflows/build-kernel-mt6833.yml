name: Build Kernel for PFGM00-MT6833

on:
  workflow_dispatch:
    inputs:
      enable_all_roots:
        description: '构建所有 Root 管理器（矩阵构建）'
        required: false
        default: false
        type: boolean
      enable_kernelsu:
        description: '启用 KernelSU 支持'
        required: false
        default: false
        type: boolean
      enable_kernelsu_next:
        description: '启用 KernelSU-Next 支持'
        required: false
        default: false
        type: boolean
      enable_bakasu:
        description: '启用 BakaSU (原ReSukiSU) 支持'
        required: false
        default: false
        type: boolean
      # ========== Deprecated ==========
      enable_lxc_docker:
        description: '启用 LXC / Docker 支持 (Deprecated)'
        required: false
        default: false
        type: boolean
      enable_kvm:
        description: '启用 KVM 支持 (Deprecated)'
        required: false
        default: false
        type: boolean
      # ================================
      enable_bbr:
        description: "启用 BBR 加速"
        required: false
        default: false
        type: boolean
      enable_droidspace:
        description: '启用 DroidSpace 支持'
        required: false
        default: false
        type: boolean
      enable_susfs:
        description: '启用 SUSFS (仅 BakaSU 支持)'
        required: false
        default: false
        type: boolean
      enable_nomount:
        description: '启用 NoMount VFS 挂载'
        required: false
        default: false
        type: boolean
      branch:
        description: '选择要克隆的分支（仅限开发者）'
        required: true
        default: 'main/4.14.186'
        type: choice
        options:
          - main/4.14.186
          - main/bpf/4.14.186-2

jobs:
  # ================================
  # 1. 生成矩阵与发布标签
  # ================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup.outputs.matrix }}
      total: ${{ steps.setup.outputs.total }}
      tag: ${{ steps.setup.outputs.tag }}
      feature_suffix: ${{ steps.setup.outputs.feature_suffix }}
      tag_features: ${{ steps.setup.outputs.tag_features }}
    steps:
      - name: 生成矩阵与发布标签
        id: setup
        env:
          ENABLE_ALL_ROOTS: ${{ inputs.enable_all_roots }}
          ENABLE_KERNELSU: ${{ inputs.enable_kernelsu }}
          ENABLE_KERNELSU_NEXT: ${{ inputs.enable_kernelsu_next }}
          ENABLE_BAKASU: ${{ inputs.enable_bakasu }}

          # Deprecated
          ENABLE_LXC_DOCKER: ${{ inputs.enable_lxc_docker }}
          ENABLE_KVM: ${{ inputs.enable_kvm }}

          ENABLE_BBR: ${{ inputs.enable_bbr }}
          ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
          ENABLE_SUSFS: ${{ inputs.enable_susfs }}
          ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          # ========= 1. 收集 root 列表 =========
          ROOTS="[]"
          if [ "$ENABLE_ALL_ROOTS" = "true" ]; then
            ROOTS='["kernelsu","bakasu","kernelsu_next"]'
          else
            if [ "$ENABLE_KERNELSU" = "true" ]; then
              ROOTS=$(echo "$ROOTS" | jq -c '. + ["kernelsu"]')
            fi
            if [ "$ENABLE_KERNELSU_NEXT" = "true" ]; then
              ROOTS=$(echo "$ROOTS" | jq -c '. + ["kernelsu_next"]')
            fi
            if [ "$ENABLE_BAKASU" = "true" ]; then
              ROOTS=$(echo "$ROOTS" | jq -c '. + ["bakasu"]')
            fi
          fi

          COUNT=$(echo "$ROOTS" | jq length)
          if [ "$COUNT" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "feature_suffix=" >> "$GITHUB_OUTPUT"
            echo "tag_features=" >> "$GITHUB_OUTPUT"
            echo "未选择任何 Root 管理器，跳过构建"
            exit 0
          fi

          # ========= 2. SUSFS 生效判断（仅 bakasu 支持） =========
          SUSFS_EFFECTIVE="false"
          if [ "$ENABLE_SUSFS" = "true" ] && echo "$ROOTS" | jq -e 'index("bakasu") != null' > /dev/null; then
            SUSFS_EFFECTIVE="true"
          elif [ "$ENABLE_SUSFS" = "true" ]; then
            echo "⚠️ 勾选了 SUSFS，但未选择 bakasu；SUSFS 仅 BakaSU 支持，将被忽略"
          fi

          # ========= 3. artifact 公共后缀（不含 SUSFS） =========
          FUNC_SUFFIX=""
          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-Docker"; fi
          if [ "$ENABLE_KVM" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-KVM"; fi
          if [ "$ENABLE_BBR" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-BBR"; fi
          if [ "$ENABLE_DROIDSPACE" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-DroidSpace"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then FUNC_SUFFIX="${FUNC_SUFFIX}-NoMount"; fi

          # ========= 4. 生成 matrix（SUSFS 仅挂 bakasu） =========
          MATRIX=$(for root in $(echo "$ROOTS" | jq -r '.[]'); do
            case "$root" in
              bakasu)        NAME="PFGM00-MT6833-BakaSU" ;;
              kernelsu_next) NAME="PFGM00-MT6833-KernelSU-Next" ;;
              *)             NAME="PFGM00-MT6833-RKSU" ;;
            esac
            NAME="${NAME}${FUNC_SUFFIX}"
            if [ "$root" = "bakasu" ] && [ "$SUSFS_EFFECTIVE" = "true" ]; then
              NAME="${NAME}-SUSFS"
            fi
            jq -cn --arg root "$root" --arg artifact "$NAME" \
              --argjson susfs "$([ "$root" = "bakasu" ] && echo "$SUSFS_EFFECTIVE" || echo false)" \
              '{root:$root, artifact:$artifact, susfs:$susfs}'
          done | jq -s -c .)

          # ========= 5. 计算 base =========
          if [ "$COUNT" -gt 1 ]; then
            BASE="all"
          else
            ROOT_ONLY=$(echo "$ROOTS" | jq -r '.[0]')
            case "$ROOT_ONLY" in
              bakasu)        BASE="bakasu" ;;
              kernelsu_next) BASE="kernelsu-next" ;;
              *)             BASE="rksu" ;;
            esac
          fi

          # ========= 6. 计算 tag features（小写，不含 Deprecated） =========
          TAG_FEATURES=""
          if [ "$ENABLE_BBR" = "true" ]; then TAG_FEATURES="${TAG_FEATURES}-bbr"; fi
          if [ "$ENABLE_DROIDSPACE" = "true" ]; then TAG_FEATURES="${TAG_FEATURES}-droidspace"; fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then TAG_FEATURES="${TAG_FEATURES}-nomount"; fi
          if [ "$SUSFS_EFFECTIVE" = "true" ]; then TAG_FEATURES="${TAG_FEATURES}-susfs"; fi

          # ========= 7. 生成 Release Tag =========
          # 格式：PFGM00-<date>-r<run>-<base>[-<features>]
          TAG="PFGM00-$(date -u +'%Y%m%d')-r${RUN_NUMBER}-${BASE}${TAG_FEATURES}"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "total=$COUNT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "feature_suffix=$FUNC_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag_features=$TAG_FEATURES" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"
          echo "Tag: $TAG"
          echo "Feature Suffix (common): $FUNC_SUFFIX"
          echo "SUSFS effective: $SUSFS_EFFECTIVE"

  # ================================
  # 2. 矩阵构建
  # ================================
  build:
    needs: setup
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      ROOT_TYPE: ${{ matrix.root }}
      ARTIFACT_NAME: ${{ matrix.artifact }}
      FEATURE_SUFFIX: ${{ needs.setup.outputs.feature_suffix }}
      RELEASE_TAG: ${{ needs.setup.outputs.tag }}
      # Deprecated
      ENABLE_LXC_DOCKER: ${{ inputs.enable_lxc_docker }}
      ENABLE_KVM: ${{ inputs.enable_kvm }}

      ENABLE_BBR: ${{ inputs.enable_bbr }}
      ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      ENABLE_NOMOUNT: ${{ inputs.enable_nomount }}
      BRANCH: ${{ inputs.branch }}
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install \
            git make bc bison ccache openssl dos2unix zip kmod cpio flex \
            libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler \
            ca-certificates python3 \
            binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            jq
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

          echo "===== 检查 ld ====="
          which ld || echo "WARN: 系统 ld not found"
          ld --version 2>/dev/null | head -n1 || true

      - name: 下载 GCC / Clang 工具链
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace

          mkdir -p gcc64 gcc32 clang-aosp

          # 64 位 GCC 工具链
          wget -O gcc-aarch64.tar.gz --tries=3 --timeout=30 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz \
            || wget -O gcc-aarch64.tar.gz --tries=3 --timeout=30 \
            https://github.com/EnderPhantomWing/kernel_oppo_mt6833/releases/download/toolchain/aarch64-linux-android-4.9-refs_tags_android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxf gcc-aarch64.tar.gz

          # 32 位 GCC 工具链
          wget -O gcc-arm.tar.gz --tries=3 --timeout=30 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz \
            || wget -O gcc-arm.tar.gz --tries=3 --timeout=30 \
            https://github.com/EnderPhantomWing/kernel_oppo_mt6833/releases/download/toolchain/arm-linux-androideabi-4.9-refs_tags_android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxf gcc-arm.tar.gz

          # Clang 工具链 (AOSP)
          git clone -q --depth=1 \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 \
            -b 10.0 clang-aosp

          echo "===== 工具链目录检查（仅供参考，不阻断构建）====="
          ls -l gcc64/bin/aarch64-linux-android-gcc 2>/dev/null || \
            echo "WARN: gcc64/bin/aarch64-linux-android-gcc 不存在（内核主要由 clang 构建，可忽略）"
          ls -l gcc32/bin/arm-linux-androideabi-gcc 2>/dev/null || \
            echo "WARN: gcc32/bin/arm-linux-androideabi-gcc 不存在（内核主要由 clang 构建，可忽略）"
          ls -l clang-aosp/bin/ld.lld 2>/dev/null || \
            echo "WARN: clang-aosp/bin/ld.lld not found"

      - name: 下载内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone -b "$BRANCH" \
            https://github.com/EnderPhantomWing/kernel_oppo_mt6833.git android-kernel

      - name: 设置 ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-mt6833-${{ matrix.root }}
          max-size: 2G

      - name: 应用 Root 补丁
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          if [ "$ENABLE_SUSFS" = "true" ] && [ "$ROOT_TYPE" = "bakasu" ]; then
            echo "KSU_LOG: BakaSU + SUSFS 模式，跳过 kernel-4.14.patch，稍后由 susfs_inline_hook_patches.sh 注入钩子"
          else
            echo "KSU_LOG: root=${ROOT_TYPE} 不支持 SUSFS，SUSFS 选项被忽略 使用KSU_MANUAL_HOOK"
            case "$ROOT_TYPE" in
              kernelsu)
                echo "KSU_LOG: 下载并应用 RKSU 官方 4.14 补丁"
                wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.14.patch -O ksu-4.14.patch
                patch -p1 < ksu-4.14.patch || { echo "补丁应用失败"; exit 1; }
                ;;
              kernelsu_next)
                echo "KSU_LOG: 下载并应用 KernelSU Next 官方 4.14 补丁"
                wget https://github.com/rksuorg/kernel_patches/raw/master/manual_hook/kernel-4.14.patch -O ksu-4.14.patch
                patch -p1 < ksu-4.14.patch || { echo "补丁应用失败"; exit 1; }
                ;;
              bakasu)
                echo "KSU_LOG: 下载并应用 BakaSU (ReSukiSU) 官方 4.14 补丁"
                wget https://github.com/ReSukiSU/ReSukiSU_Patches/raw/main/scope-minimized/kernel-4.14.patch -O ksu-4.14.patch
                patch -p1 < ksu-4.14.patch || { echo "补丁应用失败"; exit 1; }
                ;;
            esac
          fi

      - name: 启用 SUSFS（仅 BakaSU）
        if: env.ENABLE_SUSFS == 'true' && env.ROOT_TYPE == 'bakasu'
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "KSU_LOG: 启用 SUSFS"
          wget https://raw.githubusercontent.com/EnderPhantomWing/kernel-patch/refs/heads/main/susfs_patch_to_4.14.patch -O susfs-4.14.patch
          patch -p1 < susfs-4.14.patch || { echo "SUSFS 补丁应用失败"; exit 1; }
          sed -i 's/^orig_flow:$/orig_flow:;/' fs/notify/fdinfo.c
          grep -q '^orig_flow:;$' fs/notify/fdinfo.c \
            || { echo "SUSFS fdinfo 兼容性修复失败"; exit 1; }

      - name: 启用 NoMount
        if: env.ENABLE_NOMOUNT == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "KSU_LOG: 启用 NoMount VFS 挂载"
          curl -LfsS \
            https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
            -o nomount-setup.sh \
            || { echo "下载 NoMount setup 脚本失败"; exit 1; }
          bash nomount-setup.sh dev

      - name: 注入 Root 核心代码
        id: inline
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace

          if [ "$ROOT_TYPE" = "kernelsu" ]; then
            git clone --bare https://github.com/rsuntk/KernelSU.git
            COUNT=$(git -C KernelSU.git rev-list --count HEAD)
            MV=$((29971 + COUNT))
            echo "ksu_manager_version_code=$MV"
            echo "$MV" > manager_version_kernelsu.txt

            cd android-kernel
            rm -rf KernelSU
            curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash
          elif [ "$ROOT_TYPE" = "kernelsu_next" ]; then
            git clone --bare https://github.com/KernelSU-Next/KernelSU-Next.git
            COUNT=$(git -C KernelSU-Next.git rev-list --count HEAD)
            MV=$((1 * 30000 + COUNT))
            echo "ksu_next_manager_version_code=$MV"
            echo "$MV" > manager_version_kernelsu_next.txt

            cd android-kernel
            rm -rf KernelSU
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          else
            git clone --bare https://github.com/Baka-SU/BakaSU.git
            COUNT=$(git -C BakaSU.git rev-list --count HEAD)
            MV=$((30000 + COUNT + 700))
            echo "bakasu_manager_version_code=$MV"
            echo "$MV" > manager_version_bakasu.txt

            cd android-kernel
            rm -rf KernelSU
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          fi

          if [ "$ENABLE_SUSFS" = "true" ] && [ "$ROOT_TYPE" = "bakasu" ]; then
            echo "KSU_LOG: 应用 SUSFS 内联钩子（对应 CONFIG_KSU_SUSFS choice）"
            curl -LfsS \
              https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh \
              -o susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh

            echo "===== 验证内联钩子注入结果 ====="
            for f in fs/exec.c fs/open.c fs/stat.c fs/read_write.c kernel/reboot.c kernel/sys.c drivers/input/input.c; do
              if grep -q "ksu_handle" "$f"; then
                echo "[OK] $f 含 ksu_handle"
              else
                echo "[WARN] $f 未检测到 ksu_handle"
              fi
            done
          fi

      # ========== Deprecated ==========
      - name: LXC/Docker 支持
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace

          wget https://github.com/wu17481748/android-lxc-docker/releases/download/lxc-docker-2config/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x LXC-DOCKER-OPEN-CONFIG.sh
          ./LXC-DOCKER-OPEN-CONFIG.sh android-kernel/arch/arm64/configs/PFGM00_defconfig -w

          cd android-kernel
          sed -i '/CONFIG_MTK_TASK_TURBO/d' arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_MTK_TASK_TURBO is not set" >> arch/arm64/configs/PFGM00_defconfig

          cd $GITHUB_WORKSPACE/kernel_workspace
          wget https://raw.githubusercontent.com/tomxi1997/lxc-docker-support-for-android/refs/heads/main/runcpatch.sh
          chmod +x runcpatch.sh
          if [ -f android-kernel/kernel/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup.c
          fi
          if [ -f android-kernel/kernel/cgroup/cgroup.c ]; then
            ./runcpatch.sh android-kernel/kernel/cgroup/cgroup.c
          fi

          if [ -f android-kernel/net/netfilter/xt_qtaguid.c ]; then
            wget https://raw.githubusercontent.com/wu17481748/android-lxc-docker/refs/heads/main/xt_qtaguid.patch
            patch -p0 < xt_qtaguid.patch || { echo "xt_qtaguid patch 失败"; exit 1; }
          fi

          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' android-kernel/arch/arm64/configs/PFGM00_defconfig
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> android-kernel/arch/arm64/configs/PFGM00_defconfig
      # ================================

      - name: 配置 defconfig
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH

          echo "===== 环境检查 ====="
          which clang || true
          which ld.lld || true
          which aarch64-linux-android-gcc || echo "WARN: aarch64-linux-android-gcc 不在 PATH（可忽略）"
          which arm-linux-androideabi-gcc || echo "WARN: arm-linux-androideabi-gcc 不在 PATH（可忽略）"
          clang --version | head -n1 || true
          ld.lld --version | head -n1 || true

          # ========== Deprecated ==========
          # KVM
          if [ "$ENABLE_KVM" = "true" ]; then
            cat >> arch/arm64/configs/PFGM00_defconfig <<'EOF'
          CONFIG_VIRTUALIZATION=y
          CONFIG_KVM=y
          CONFIG_VHOST_NET=y
          CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y
          EOF
          fi
          # ================================

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            PFGM00_defconfig

          # BBR
          if [ "$ENABLE_BBR" = "true" ]; then
            echo "启用 BBR..."
            ./scripts/config --file out/.config \
              --enable CONFIG_TCP_CONG_BBR \
              --enable CONFIG_NET_SCH_FQ
          fi

          # DroidSpace
          if [ "$ENABLE_DROIDSPACE" = "true" ]; then
            echo "启用 DroidSpace..."
            ./scripts/config --file out/.config \
              --enable CONFIG_SYSCTL \
              --enable CONFIG_SYSVIPC \
              --enable CONFIG_POSIX_MQUEUE \
              --enable CONFIG_NAMESPACES \
              --enable CONFIG_PID_NS \
              --enable CONFIG_UTS_NS \
              --enable CONFIG_IPC_NS \
              --enable CONFIG_NET_NS \
              --enable CONFIG_MULTIUSER \
              --enable CONFIG_USER_NS \
              --enable CONFIG_DEVTMPFS \
              --enable CONFIG_DEVTMPFS_MOUNT \
              --enable CONFIG_SECCOMP \
              --enable CONFIG_SECCOMP_FILTER \
              --enable CONFIG_CGROUPS \
              --enable CONFIG_CGROUP_DEVICE \
              --enable CONFIG_CGROUP_PIDS \
              --enable CONFIG_MEMCG \
              --enable CONFIG_CGROUP_SCHED \
              --enable CONFIG_FAIR_GROUP_SCHED \
              --enable CGROUP_FREEZER \
              --enable CONFIG_CGROUP_NET_PRIO \
              --enable CONFIG_OVERLAY_FS \
              --enable CONFIG_TMPFS_POSIX_ACL \
              --enable CONFIG_TMPFS_XATTR \
              --enable CONFIG_FW_LOADER \
              --enable CONFIG_FW_LOADER_USER_HELPER \
              --enable CONFIG_FW_LOADER_COMPRESS \
              --enable CONFIG_VETH \
              --enable CONFIG_BRIDGE \
              --enable CONFIG_NETFILTER \
              --enable CONFIG_BRIDGE_NETFILTER \
              --enable CONFIG_NETFILTER_ADVANCED \
              --enable CONFIG_NF_CONNTRACK \
              --enable CONFIG_IP_NF_IPTABLES \
              --enable CONFIG_IP_NF_FILTER \
              --enable CONFIG_NF_NAT \
              --enable CONFIG_NF_TABLES \
              --enable CONFIG_IP_NF_TARGET_MASQUERADE \
              --enable CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
              --enable CONFIG_NETFILTER_XT_TARGET_TCPMSS \
              --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
              --enable CONFIG_NF_CONNTRACK_NETLINK \
              --enable CONFIG_NF_NAT_REDIRECT \
              --enable CONFIG_IP_ADVANCED_ROUTER \
              --enable CONFIG_IP_MULTIPLE_TABLES \
              --enable CONFIG_NF_CONNTRACK_IPV4 \
              --enable CONFIG_NF_NAT_IPV4 \
              --enable CONFIG_IP_NF_NAT \
              --enable CONFIG_NETFILTER_XT_MATCH_COMMENT \
              --enable CONFIG_NETFILTER_XT_MATCH_STATE \
              --enable CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
              --enable CONFIG_NETFILTER_XT_MATCH_MULTIPORT \
              --enable CONFIG_NETFILTER_XT_MATCH_HL \
              --enable CONFIG_NETFILTER_XT_TARGET_REJECT \
              --enable CONFIG_IP_NF_TARGET_REJECT \
              --enable CONFIG_NETFILTER_XT_TARGET_LOG \
              --enable CONFIG_IP_NF_TARGET_ULOG \
              --enable CONFIG_NETFILTER_XT_MATCH_RECENT \
              --enable CONFIG_NETFILTER_XT_MATCH_LIMIT \
              --enable CONFIG_NETFILTER_XT_MATCH_HASHLIMIT \
              --enable CONFIG_NETFILTER_XT_MATCH_OWNER \
              --enable CONFIG_NETFILTER_XT_MATCH_PKTTYPE \
              --enable CONFIG_NETFILTER_XT_MATCH_MARK \
              --enable CONFIG_NETFILTER_XT_TARGET_MARK \
              --enable CONFIG_IP_SET \
              --enable CONFIG_IP_SET_HASH_IP \
              --enable CONFIG_IP_SET_HASH_NET \
              --enable CONFIG_NETFILTER_XT_SET \
              --enable CONFIG_NETFILTER_NETLINK_QUEUE \
              --enable CONFIG_NETFILTER_NETLINK_LOG \
              --enable CONFIG_NETFILTER_XT_TARGET_NFLOG \
              --disable CONFIG_ANDROID_PARANOID_NETWORK
          fi

          # ========== Deprecated ==========
          # LXC/Docker
          if [ "$ENABLE_LXC_DOCKER" = "true" ]; then
            echo "KCFLAGS_EXTRA=-Wno-error=sizeof-array-div" >> "$GITHUB_ENV"
          else
            echo "KCFLAGS_EXTRA=" >> "$GITHUB_ENV"
          fi
          # ================================

          # ========= SU Hook Method（SUSFS 仅 bakasu 生效） =========
          EFFECTIVE_SUSFS="false"
          if [ "$ENABLE_SUSFS" = "true" ] && [ "$ROOT_TYPE" = "bakasu" ]; then
            EFFECTIVE_SUSFS="true"
          fi

          if [ "$EFFECTIVE_SUSFS" = "true" ]; then
            echo "KSU_LOG: BakaSU + SUSFS → 启用 CONFIG_KSU_SUSFS，禁用 MANUAL_HOOK/TRACEPOINT_HOOK"
            ./scripts/config --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_SUSFS \
              --disable CONFIG_KSU_MANUAL_HOOK \
              --disable CONFIG_KSU_TRACEPOINT_HOOK \
              --disable CONFIG_KSU_SUSFS_SUS_SU
          else
            if [ "$ENABLE_SUSFS" = "true" ]; then
              echo "KSU_LOG: root=${ROOT_TYPE} 不支持 SUSFS，回退到 MANUAL_HOOK"
            fi
            echo "KSU_LOG: 启用 CONFIG_KSU + CONFIG_KSU_MANUAL_HOOK (non-SUSFS)"
            ./scripts/config --file out/.config \
              --enable CONFIG_KSU \
              --enable CONFIG_KSU_MANUAL_HOOK \
              --disable CONFIG_KSU_SUSFS \
              --disable CONFIG_KSU_TRACEPOINT_HOOK
          fi

          # NoMount VFS
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            echo "KSU_LOG: 启用 NoMount VFS 挂载"
            ./scripts/config --file out/.config \
              --enable CONFIG_NOMOUNT \
              --enable CONFIG_KEYS
          else
            ./scripts/config --file out/.config \
              --disable CONFIG_NOMOUNT
          fi

          # DroidSpace 需要 USER_NS (docker unsafe procfs 修复)，仅在启用时保留
          if [ "$ENABLE_DROIDSPACE" = "true" ]; then
            ./scripts/config --file out/.config \
              --enable CONFIG_NAMESPACES \
              --enable CONFIG_DEVTMPFS \
              --enable CONFIG_USER_NS \
              --enable CONFIG_DEVTMPFS_MOUNT \
              --enable CONFIG_SECTION_MISMATCH_WARN_ONLY
          else
            ./scripts/config --file out/.config \
              --enable CONFIG_NAMESPACES \
              --enable CONFIG_DEVTMPFS \
              --disable CONFIG_USER_NS \
              --enable CONFIG_DEVTMPFS_MOUNT \
              --enable CONFIG_SECTION_MISMATCH_WARN_ONLY
          fi

          make O=out ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld \
            olddefconfig

          # 配置校验
          echo "===== KSU/SUSFS 配置校验 ====="
          grep -E 'CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_KSU_TRACEPOINT_HOOK|CONFIG_KSU_SUSFS_SUS_SU' out/.config || true

          if [ "$EFFECTIVE_SUSFS" = "true" ]; then
            grep -qx 'CONFIG_KSU=y' out/.config || { echo "CONFIG_KSU 未启用，终止编译"; exit 1; }
            grep -qx 'CONFIG_KSU_SUSFS=y' out/.config || { echo "CONFIG_KSU_SUSFS 未启用，终止编译"; exit 1; }

            if grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
              echo "CONFIG_KSU_MANUAL_HOOK 与 CONFIG_KSU_SUSFS 在 BakaSU choice 中互斥，不能同时启用"
              exit 1
            fi
            if grep -qx 'CONFIG_KSU_TRACEPOINT_HOOK=y' out/.config; then
              echo "CONFIG_KSU_TRACEPOINT_HOOK 与 CONFIG_KSU_SUSFS 在 BakaSU choice 中互斥"
              exit 1
            fi
            if grep -qx 'CONFIG_KSU_SUSFS_SUS_SU=y' out/.config; then
              echo "CONFIG_KSU_SUSFS_SUS_SU 必须禁用"
              exit 1
            fi
          fi

          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            grep -qx 'CONFIG_NOMOUNT=y' out/.config \
              && grep -qx 'CONFIG_KEYS=y' out/.config \
              || { echo "NoMount 或 CONFIG_KEYS 配置未生效，终止编译"; exit 1; }
          elif grep -Eq '^CONFIG_NOMOUNT=(y|m)$' out/.config; then
            echo "NoMount 未关闭，终止编译"
            exit 1
          fi

      - name: 构建内核
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
          export KBUILD_BUILD_HOST=Github@EnderPhantomWing
          export KBUILD_BUILD_USER=EnderPhantomWing

          # LOCALVERSION：-g<commit>-r<run>-<BUILD_TIME>
          # BUILD_TIME 格式：yyyyMMddTHHMMSSZ（UTC，例如 20241027T123456Z）
          # 注：以 make 启动时刻近似 "构建完成时间"，保证 uname -r 可控
          BUILD_TIME=$(date -u +%Y%m%dT%H%M%SZ)
          COMMIT_SHORT=${GITHUB_SHA:0:10}
          RUN_NUMBER=${{ github.run_number }}
          export LOCALVERSION="-g${COMMIT_SHORT}-r${RUN_NUMBER}-${BUILD_TIME}"
          echo "LOCALVERSION=${LOCALVERSION}"

          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            KCFLAGS="$KCFLAGS_EXTRA"

          KERNEL_VERSION=$(make -s O=out ARCH=arm64 kernelrelease | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "KERNEL_VERSION=${KERNEL_VERSION}"
          echo "$KERNEL_VERSION" > "$GITHUB_WORKSPACE/kernel_workspace/kernel_version_${ROOT_TYPE}.txt"

      - name: 打包 AnyKernel3 与镜像 (AK3- 前缀)
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/EnderPhantomWing/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md

          ZIP_NAME="AK3-${ARTIFACT_NAME}.zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)

          cp android-kernel/out/arch/arm64/boot/Image.gz "Image-${ARTIFACT_NAME}.gz"
          ls -lh "${ZIP_NAME}" "Image-${ARTIFACT_NAME}.gz"

      - name: 使用 magiskboot 重建 boot 镜像
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel_workspace

          MV=$(tr -d '[:space:]' < "manager_version_${ROOT_TYPE}.txt")
          echo "Manager version: $MV"

          mkdir -p bootwork
          cd bootwork

          echo "===== 下载 magiskboot ====="
          wget -q -O magiskboot "https://github.com/Uevo001/magiskboot-linux/raw/refs/heads/main/x86_64/magiskboot"
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -n3 || true

          echo "===== 下载 boot-ressu-35056.img ====="
          wget -q -O boot-ressu-35056.img \
            "https://github.com/EnderPhantomWing/kernel_oppo_mt6833/releases/download/20260810/boot-ressu-35056.img"
          ls -lh boot-ressu-35056.img

          echo "===== magiskboot unpack ====="
          ./magiskboot unpack boot-ressu-35056.img
          ls -la

          echo "===== 替换 kernel ====="
          gunzip -c "../Image-${ARTIFACT_NAME}.gz" > kernel
          ls -lh kernel

          echo "===== magiskboot repack ====="
          ./magiskboot repack boot-ressu-35056.img
          ls -lh new-boot.img

          # boot 包名：boot-<mv>-<artifact>.img（artifact 已含 SUSFS/特性后缀）
          FINAL_NAME="boot-${MV}-${ARTIFACT_NAME}.img"
          echo "Final boot name: ${FINAL_NAME}"
          cp new-boot.img "../${FINAL_NAME}"
          cd ..
          ls -lh "${FINAL_NAME}"

      - name: 上传 AK3 包
        uses: actions/upload-artifact@v4
        with:
          name: ak3-${{ matrix.root }}
          path: kernel_workspace/AK3-${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: 上传内核镜像
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.root }}
          path: kernel_workspace/Image-${{ matrix.artifact }}.gz
          if-no-files-found: error

      - name: 上传重建的 boot 镜像
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.root }}
          path: kernel_workspace/boot-*.img
          if-no-files-found: error

      - name: 上传版本信息
        uses: actions/upload-artifact@v4
        with:
          name: version-info-${{ matrix.root }}
          path: |
            kernel_workspace/kernel_version_${{ matrix.root }}.txt
            kernel_workspace/manager_version_${{ matrix.root }}.txt
          if-no-files-found: warn

  # ================================
  # 3. 摘要与发布
  # ================================
  release:
    needs: [setup, build]
    if: needs.setup.outputs.total != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成摘要
        id: summary
        run: |
          {
            echo "### Build Variables Summary"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Branch** | ${{ inputs.branch }} |"
            echo "| **Root Config** | ${{ needs.setup.outputs.matrix }} |"
            echo "| **Total** | ${{ needs.setup.outputs.total }} |"
            echo "| **Publish Tag** | ${{ needs.setup.outputs.tag }} |"
            echo "| **Tag Features** | \`${{ needs.setup.outputs.tag_features }}\` |"
            echo "| **Enable BBR** | ${{ inputs.enable_bbr }} |"
            echo "| **Enable DroidSpace** | ${{ inputs.enable_droidspace }} |"
            echo "| **Enable SUSFS (BakaSU only)** | ${{ inputs.enable_susfs }} |"
            echo "| **Enable NoMount** | ${{ inputs.enable_nomount }} |"
            echo ""
            echo "> ⚠️ SUSFS only applies to the BakaSU branch; RKSU/KernelSU-Next will automatically ignore this item."
            echo "> ⚠️ LXC/Docker & KVM have been marked as Deprecated. Please build them yourself if needed. "
            echo ""
            echo "### Environment Infomation"
            echo ""
            echo "| Variable | Value |"
            echo "|------|-----|"
            echo "| **Commit SHA** | ${{ github.sha }} |"
            echo "| **Action Run Number** | ${{ github.run_number }} |"
            echo "| **Action Name** | Build Kernel for PFGM00-MT6833 |"
          } > summary.md
          cat summary.md >> $GITHUB_STEP_SUMMARY
          {
            echo "summary_release<<EOF"
            cat summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载 BakaSU Manager APK
        if: contains(needs.setup.outputs.matrix, 'bakasu')
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_PAT }}
        continue-on-error: true
        run: |
          set -euo pipefail
          MATRIX='${{ needs.setup.outputs.matrix }}'
          mkdir -p artifacts/apks

          echo "===== 获取 BakaSU_CI releases 列表 ====="
          RELEASES_JSON=$(gh api --paginate --slurp /repos/EnderPhantomWing/BakaSU_CI/releases | jq -c 'add // []')
          echo "共获取 release 数量: $(echo "$RELEASES_JSON" | jq 'length')"

          echo "$MATRIX" | jq -r '.[] | [.root, .artifact] | @tsv' | while IFS=$'\t' read -r root artifact; do
            MV_FILE="artifacts/manager_version_${root}.txt"
            if [ ! -f "$MV_FILE" ]; then
              echo "跳过 ${root}: 未找到 manager 版本文件"
              continue
            fi

            MV=$(tr -d '[:space:]' < "$MV_FILE")
            if [ -z "$MV" ]; then
              echo "跳过 ${root}: manager 版本为空"
              continue
            fi

            MV_CLEAN="${MV#v}"
            MV_CLEAN="${MV_CLEAN#V}"

            echo "----- 处理 root=${root}, 版本=${MV_CLEAN} -----"

            ASSET_JSON=$(echo "$RELEASES_JSON" | jq -c --arg mv "$MV_CLEAN" '
              [
                .[]
                | . as $rel
                | .assets[]?
                | select(.name | test("-arm64-v8a-release\\.apk$"; "i"))
                | select(
                    (.name               | contains($mv))
                    or ($rel.tag_name    | contains($mv))
                    or (($rel.name // "") | contains($mv))
                  )
                | {
                    tag:  $rel.tag_name,
                    name: .name,
                    url:  .browser_download_url
                  }
              ] | first // empty
            ')

            DOWNLOAD_URL=$(echo "$ASSET_JSON" | jq -r '.url  // empty')
            ASSET_NAME=$(echo "$ASSET_JSON"   | jq -r '.name // empty')
            MATCHED_TAG=$(echo "$ASSET_JSON"  | jq -r '.tag  // empty')

            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
              echo "警告: 未找到匹配 ${MV_CLEAN} 的 *-arm64-v8a-release.apk，跳过 ${root}"
              continue
            fi

            echo "命中 tag=${MATCHED_TAG} 资产=${ASSET_NAME}"
            echo "下载 ${DOWNLOAD_URL} -> artifacts/apks/${ASSET_NAME}"
            curl -fL --retry 3 --retry-delay 5 \
              -o "artifacts/apks/${ASSET_NAME}" \
              "$DOWNLOAD_URL"
            ls -lh "artifacts/apks/${ASSET_NAME}"
          done

          echo "===== artifacts/apks 内容 ====="
          ls -lh artifacts/apks/ || true

      - name: 下载 KernelSU-Next Manager APK
        if: contains(needs.setup.outputs.matrix, 'kernelsu_next')
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_PAT }}
        continue-on-error: true
        run: |
          set -euo pipefail
          MATRIX='${{ needs.setup.outputs.matrix }}'
          mkdir -p artifacts/apks

          echo "===== 获取 KernelSU_Next_CI releases 列表 ====="
          RELEASES_JSON=$(gh api --paginate --slurp /repos/EnderPhantomWing/KernelSU_Next_CI/releases | jq -c 'add // []')
          echo "共获取 release 数量: $(echo "$RELEASES_JSON" | jq 'length')"

          echo "$MATRIX" | jq -r '.[] | [.root, .artifact] | @tsv' | while IFS=$'\t' read -r root artifact; do
            MV_FILE="artifacts/manager_version_${root}.txt"
            if [ ! -f "$MV_FILE" ]; then
              echo "跳过 ${root}: 未找到 manager 版本文件"
              continue
            fi

            MV=$(tr -d '[:space:]' < "$MV_FILE")
            if [ -z "$MV" ]; then
              echo "跳过 ${root}: manager 版本为空"
              continue
            fi

            MV_CLEAN="${MV#v}"
            MV_CLEAN="${MV_CLEAN#V}"

            echo "----- 处理 root=${root}, 版本=${MV_CLEAN} -----"

            ASSET_JSON=$(echo "$RELEASES_JSON" | jq -c --arg mv "$MV_CLEAN" '
              [
                .[]
                | . as $rel
                | .assets[]?
                | select(.name | test("-release\\.apk$"; "i"))
                | select(.name | test("-spoofed_.*-release\\.apk$"; "i") | not)
                | select(
                    (.name               | contains($mv))
                    or ($rel.tag_name    | contains($mv))
                    or (($rel.name // "") | contains($mv))
                  )
                | {
                    tag:  $rel.tag_name,
                    name: .name,
                    url:  .browser_download_url
                  }
              ] | first // empty
            ')

            DOWNLOAD_URL=$(echo "$ASSET_JSON" | jq -r '.url  // empty')
            ASSET_NAME=$(echo "$ASSET_JSON"   | jq -r '.name // empty')
            MATCHED_TAG=$(echo "$ASSET_JSON"  | jq -r '.tag  // empty')

            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
              echo "警告: 未找到匹配 ${MV_CLEAN} 的 *-release.apk，跳过 ${root}"
              continue
            fi

            echo "命中 tag=${MATCHED_TAG} 资产=${ASSET_NAME}"
            echo "下载 ${DOWNLOAD_URL} -> artifacts/apks/${ASSET_NAME}"
            curl -fL --retry 3 --retry-delay 5 \
              -o "artifacts/apks/${ASSET_NAME}" \
              "$DOWNLOAD_URL"
            ls -lh "artifacts/apks/${ASSET_NAME}"
          done

          echo "===== artifacts/apks 内容 ====="
          ls -lh artifacts/apks/ || true

      - name: 列出已下载文件
        run: find artifacts -type f

      - name: 创建发布并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.tag }}
          body: |
            Automated Release
            Enjoy Kernel~!

            ${{ steps.summary.outputs.summary_release }}
          files: |
            artifacts/*.zip
            artifacts/*.gz
            artifacts/*.img
            artifacts/apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
