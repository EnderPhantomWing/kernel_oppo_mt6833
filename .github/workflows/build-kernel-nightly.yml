name: Schedule Trigger for Build Kernel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NIGHTLY_PAT }}
    steps:
      # ========== 仅一波：Bakasu 构建，5 个并行 ==========
      - name: 并行触发 Bakasu 构建
        run: |
          set -euo pipefail

          trigger() {
            local desc="$1"
            shift
            echo "触发: ${desc}"
            gh workflow run build-kernel-mt6833.yml \
              --repo "${{ github.repository }}" \
              "$@"
          }

          pids=()
          trigger "BakaSU + BBR" \
            -f enable_bakasu=true \
            -f enable_bbr=true & pids+=("$!")
          trigger "BakaSU + BBR + NoMount" \
            -f enable_bakasu=true \
            -f enable_bbr=true \
            -f enable_nomount=true & pids+=("$!")
          trigger "BakaSU + BBR + SUSFS" \
            -f enable_bakasu=true \
            -f enable_bbr=true \
            -f enable_susfs=true & pids+=("$!")
          trigger "BakaSU + BBR + SUSFS + NoMount" \
            -f enable_bakasu=true \
            -f enable_bbr=true \
            -f enable_susfs=true \
            -f enable_nomount=true & pids+=("$!")

          for pid in "${pids[@]}"; do
            wait "$pid"
          done
